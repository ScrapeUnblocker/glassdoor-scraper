[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glassdoor-scraper"
version = "0.1.0"
description = "Scrape Glassdoor jobs, job details, company ratings and reviews, and salaries into clean JSON/CSV via the ScrapeUnblocker API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ScrapeUnblocker" }]
keywords = [
    "glassdoor",
    "glassdoor-scraper",
    "glassdoor-api",
    "glassdoor-jobs",
    "glassdoor-reviews",
    "glassdoor-salaries",
    "job-scraper",
    "jobs",
    "salary-data",
    "company-reviews",
    "web-scraping",
    "scraper",
    "scrapeunblocker",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["scrapeunblocker>=0.11,<1", "beautifulsoup4>=4.9"]

[project.urls]
Homepage = "https://scrapeunblocker.com/?utm_source=github&utm_medium=integration&utm_campaign=example-repos"
Documentation = "https://docs.scrapeunblocker.com/?utm_source=github&utm_medium=integration&utm_campaign=example-repos"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
glassdoor-scraper = "glassdoor_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
